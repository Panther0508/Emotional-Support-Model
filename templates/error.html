{% extends "base.html" %}

{% block title %}Error {{ error_code }} - Emotional Support AI{% endblock %}

{% block content %}
<div class="error-page">
    <div class="error-content">
        <div class="error-code">{{ error_code }}</div>
        <h1>Oops! Something went wrong</h1>
        <p>{{ message }}</p>

        <div class="error-actions">
            <a href="{{ url_for('index') }}" class="btn btn-primary">
                <i class="fas fa-home"></i> Go Home
            </a>
            <a href="{{ url_for('chat') }}" class="btn btn-outline">
                <i class="fas fa-comments"></i> Start Chat
            </a>
        </div>

        <div class="error-illustration">
            <i class="fas fa-robot"></i>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_css %}
<style>
    .error-page {
        min-height: calc(100vh - 200px);
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 2rem;
    }

    .error-content {
        text-align: center;
        max-width: 600px;
    }

    .error-code {
        font-size: 8rem;
        font-weight: 700;
        color: var(--accent);
        line-height: 1;
        margin-bottom: 1rem;
    }

    .error-content h1 {
        font-size: 2rem;
        margin-bottom: 1rem;
    }

    .error-content p {
        color: var(--text-secondary);
        font-size: 1.1rem;
        margin-bottom: 2rem;
    }

    .error-actions {
        display: flex;
        gap: 1rem;
        justify-content: center;
        margin-bottom: 3rem;
    }

    .error-illustration {
        font-size: 6rem;
        color: var(--text-secondary);
        opacity: 0.3;
    }
</style>
{% endblock %}
